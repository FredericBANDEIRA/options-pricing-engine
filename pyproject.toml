[project]
name = "options-pricer"
version = "0.1.0"
description = "A professional-grade vanilla options pricer with full Greeks, interactive charts, and quant interview prep."
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.45",
    "plotly>=6.0",
    "numpy>=2.0",
    "scipy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
